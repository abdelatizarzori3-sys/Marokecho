name: 🔧 CI - بناء واختبار

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: 📥 استنساخ المستودع
        uses: actions/checkout@v4

      - name: 🐍 إعداد Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 تثبيت المتطلبات
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: 🔍 فحص الكود (Lint)
        run: |
          flake8 app.py components.py test.py --max-line-length=100 --extend-ignore=E501

      - name: 🎨 تنسيق الكود (Format Check)
        run: |
          black --check app.py components.py test.py

      - name: 🧪 تشغيل الاختبارات
        run: |
          python test.py

      - name: 📊 تغطية الاختبارات
        run: |
          pip install coverage
          coverage run test.py
          coverage report

  security:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 استنساخ المستودع
        uses: actions/checkout@v4

      - name: 🔒 فحص الأمان (Bandit)
        run: |
          pip install bandit
          bandit -r . -f json -o bandit-report.json || true
          bandit -r . || true

  build:
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - name: 📥 استنساخ المستودع
        uses: actions/checkout@v4

      - name: 📦 بناء الحزمة
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build || echo "No setup.py - skipping build"

      - name: 📤 رفع النتائج
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            *.zip
            *.tar.gz
